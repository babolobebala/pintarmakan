name: deploy-cpanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        env:
          NITRO_PRESET: node-server
        run: pnpm run build

      - name: Prepare release bundle
        run: |
          mkdir -p .deploy/release/tmp
          printf '%s\n' "${GITHUB_SHA}" > DEPLOY_COMMIT
          cp -R .output .deploy/release/.output
          cp app.cjs .deploy/release/app.cjs
          cp package.json .deploy/release/package.json
          cp DEPLOY_COMMIT .deploy/release/DEPLOY_COMMIT
          touch .deploy/release/tmp/restart.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-release
          path: .deploy/release
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: cpanel-release
          path: .deploy

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: .deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/
          dangerous-clean-slate: true
