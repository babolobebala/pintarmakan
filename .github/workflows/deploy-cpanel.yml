name: deploy-cpanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Validate Web Push build environment
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
        run: |
          set -eu

          test -n "${VAPID_PUBLIC_KEY}" || { echo "Missing VAPID_PUBLIC_KEY in build environment"; exit 1; }
          test -n "${VAPID_PRIVATE_KEY}" || { echo "Missing VAPID_PRIVATE_KEY in build environment"; exit 1; }
          test -n "${VAPID_SUBJECT}" || { echo "Missing VAPID_SUBJECT in build environment"; exit 1; }

          printf '%s' "${VAPID_PUBLIC_KEY}" | grep -Eq '^[A-Za-z0-9_-]+$' || {
            echo "VAPID_PUBLIC_KEY is present but not valid URL-safe base64"
            exit 1
          }

          echo "Web Push build environment validated"

      - name: Build
        env:
          NITRO_PRESET: node-server
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || vars.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
        run: pnpm run build

      - name: Prepare release bundle
        run: |
          mkdir -p .deploy/release
          printf '%s\n' "${GITHUB_SHA}" > DEPLOY_COMMIT
          cp -R .output .deploy/release/.output
          find .deploy/release/.output -type f -name "*.map" -delete
          cp app.cjs .deploy/release/app.cjs
          cp package.json .deploy/release/package.json
          cp DEPLOY_COMMIT .deploy/release/DEPLOY_COMMIT
          tar -czf .deploy/cpanel-release.tar.gz -C .deploy/release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-release
          path: .deploy/cpanel-release.tar.gz
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: cpanel-release
          path: .deploy

      - name: Resolve SSH configuration
        env:
          SSH_HOST_SECRET: ${{ secrets.SSH_HOST }}
          SSH_HOST_VAR: ${{ vars.SSH_HOST }}
          SSH_USERNAME_SECRET: ${{ secrets.SSH_USERNAME }}
          SSH_USERNAME_VAR: ${{ vars.SSH_USERNAME }}
          SSH_PORT_SECRET: ${{ secrets.SSH_PORT }}
          SSH_PORT_VAR: ${{ vars.SSH_PORT }}
          SSH_PRIVATE_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_VAR: ${{ vars.SSH_PRIVATE_KEY }}
          APP_PATH_SECRET: ${{ secrets.APP_PATH }}
          APP_PATH_VAR: ${{ vars.APP_PATH }}
        run: |
          set -eu

          SSH_HOST_VALUE="${SSH_HOST_SECRET:-${SSH_HOST_VAR:-}}"
          SSH_USERNAME_VALUE="${SSH_USERNAME_SECRET:-${SSH_USERNAME_VAR:-}}"
          SSH_PORT_VALUE="${SSH_PORT_SECRET:-${SSH_PORT_VAR:-22}}"
          SSH_PRIVATE_KEY_VALUE="${SSH_PRIVATE_KEY_SECRET:-${SSH_PRIVATE_KEY_VAR:-}}"
          APP_PATH_VALUE="${APP_PATH_SECRET:-${APP_PATH_VAR:-}}"

          test -n "$SSH_HOST_VALUE" || { echo "Missing SSH_HOST secret or variable"; exit 1; }
          test -n "$SSH_USERNAME_VALUE" || { echo "Missing SSH_USERNAME secret or variable"; exit 1; }
          test -n "$SSH_PRIVATE_KEY_VALUE" || { echo "Missing SSH_PRIVATE_KEY secret or variable"; exit 1; }
          test -n "$APP_PATH_VALUE" || { echo "Missing APP_PATH secret or variable"; exit 1; }

          {
            echo "SSH_HOST=$SSH_HOST_VALUE"
            echo "SSH_USERNAME=$SSH_USERNAME_VALUE"
            echo "SSH_PORT=$SSH_PORT_VALUE"
            echo "APP_PATH=$APP_PATH_VALUE"
          } >> "$GITHUB_ENV"

          printf '%s\n' "$SSH_PRIVATE_KEY_VALUE" > .deploy/id_ed25519
          chmod 600 .deploy/id_ed25519

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          APP_PATH: ${{ env.APP_PATH }}
        run: |
          set -eu
          scp -i .deploy/id_ed25519 -P "${SSH_PORT}" .deploy/cpanel-release.tar.gz \
            "${SSH_USERNAME}@${SSH_HOST}:${APP_PATH}/release.tar.gz"

      - name: Extract archive and restart app
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_USERNAME: ${{ env.SSH_USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          APP_PATH: ${{ env.APP_PATH }}
        run: |
          set -eu
          ssh -i .deploy/id_ed25519 -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" <<EOF
          set -eu
          APP_PATH="${APP_PATH}"
          RELEASE_DIR="\$APP_PATH/.release"

          mkdir -p "\$APP_PATH/tmp"
          rm -rf "\$RELEASE_DIR"
          mkdir -p "\$RELEASE_DIR"

          tar -xzf "\$APP_PATH/release.tar.gz" -C "\$RELEASE_DIR"

          rm -rf "\$APP_PATH/.output"
          mv -f "\$RELEASE_DIR/.output" "\$APP_PATH/.output"
          mv -f "\$RELEASE_DIR/app.cjs" "\$APP_PATH/app.cjs"
          mv -f "\$RELEASE_DIR/package.json" "\$APP_PATH/package.json"
          mv -f "\$RELEASE_DIR/DEPLOY_COMMIT" "\$APP_PATH/DEPLOY_COMMIT"

          rm -rf "\$RELEASE_DIR"
          rm -f "\$APP_PATH/release.tar.gz"
          touch "\$APP_PATH/tmp/restart.txt"
          EOF
